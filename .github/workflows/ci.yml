# -----------------------------------------------------------------------------
#  .github/workflows/ci.yml
#  Continuous Integration pipeline. Runs the full test suite on every push and
#  pull request, then uploads the Playwright HTML report and Allure results.
#
#  Secrets: add BASE_URL / credentials as GitHub Actions secrets and reference
#  them with ${{ secrets.X }} instead of hardcoding them here.
# -----------------------------------------------------------------------------
name: Playwright CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # allows manual runs from the Actions tab

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests against staging
        env:
          TEST_ENV: staging
          # URLs/credentials come from config/staging.env. For your own app,
          # override them here with GitHub Actions secrets, e.g.:
          #   BASE_URL: ${{ secrets.BASE_URL }}
          #   USERNAME: ${{ secrets.USERNAME }}
          #   PASSWORD: ${{ secrets.PASSWORD }}
        run: npm run test:chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/html-report/
          retention-days: 14

      - name: Upload test traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
